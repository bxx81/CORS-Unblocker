<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 560px;
        margin: 24px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 18px;
      }
      p.note {
        color: #555;
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      input {
        flex: 1;
        padding: 6px;
      }
      button {
        padding: 6px 12px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        margin-bottom: 6px;
        font-size: 13px;
      }
      .remove {
        color: #c00;
        cursor: pointer;
        border: none;
        background: none;
      }
      .msg {
        font-size: 13px;
        margin: 8px 0;
      }
      .msg.ok {
        color: #080;
      }
      .msg.err {
        color: #c00;
      }
      .defaults {
        font-size: 12px;
        color: #888;
      }
    </style>
  </head>
  <body>
    <h1>CORS Unblocker — Manage hosts</h1>
    <p class="note">
      Add the API hosts you want to unblock (CORS headers added to their
      responses). Enter a host like <code>api.example.com</code>. Adding a host
      shows a permission prompt for that host.
    </p>
    <div class="row">
      <input id="hostInput" type="text" placeholder="api.example.com" />
      <button id="addBtn">Add</button>
    </div>
    <div id="msg" class="msg"></div>
    <ul id="list"></ul>
    <p class="defaults" id="defaults"></p>
    <script src="options.js"></script>
  </body>
</html>
